<head>

    /*主菜单*/
   
    ul {

    li {

        display: block;

    li a:hover {

    }

<style id="stylerightmenu"></style>
<style id="pageStyle"></style>
<script id="menuscript"></script>
<script id="pageScript"></script>
<script>
    var currentMenu
    var currentPage
    var gResJson

    window.onload=async function() {
        window.doWebLog("qianbao page")

        //async  init page
        var result = await  window.doGetComponent("rightmenu")
        var obj = JSON.parse(result)
        document.getElementById('stylerightmenu').innerHTML = obj.css   
        document.getElementById('rightmenudiv').innerHTML = obj.html
        document.getElementById('menuscript').innerHTML = obj.js  

        // window.doGetComponent("rightmenu").then( (result) => {
        //         var obj = JSON.parse(result)
        //         document.getElementById('stylerightmenu').innerHTML = obj.css   
        //         document.getElementById('rightmenudiv').innerHTML = obj.html
        //         document.getElementById('menuscript').innerHTML = obj.js            
        //     }
        // )

        initMenu()
        changePage("qianbao","qianbao")          
        checkConfig()
    }

    function checkConfig(){
        window.doCheckNode().then ( (result) => {
            var obj = JSON.parse(result)
            window.doWebLog("checkconfig：" + result)
            window.doWebLog(obj)
            if ( 0 != obj.Code) {
                MYDIALOG.ShowDiv(obj.Msg)
            }
        })    
    }

    async function gLoadRes() {
        var res = await window.doGetRes(currentPage)
        if (res != "") {
            gResJson = JSON.parse(res)
            for (var ele in gResJson) {
                var obj = document.getElementById(ele)
                window.doWebLog(ele+obj) 
                if (obj != null) {
                    obj.innerText = gResJson[ele]
                }
            }
        }
    }

    function gGetRes(res) {
        if (gResJson != null) {
            return gResJson[res]
        } else {
            return ""
        }
    }
    

    async function initMenu() {
        var result = await window.doGetAccounts()
        var acc = JSON.parse(result)
        var se = document.getElementById("add")
        se.options.length = 0
        for (i=0; i<acc.accounts.length; i++){
            window.doWebLog(acc.accounts[i])
            var option = document.createElement("option")
            option.text = acc.accounts[i].address
            option.value = acc.accounts[i].address
            se.add(option)
        }

        var res = await window.doGetRes("main")
        if (res != "") {
            var resjson = JSON.parse(res)
            for (var ele in resjson) {
                 document.getElementById(ele).innerText = resjson[ele]
            }
        }
    } 

    function setCurrentMenu(menuName){
        currentMenu = menuName
    }
    function getCurrentMenu(){
        return currentMenu
    }
    function setCurrentPage(pageName){
        currentPage = pageName
    }
    function getCurrentPage(){
        return currentPage
    }


    async function changePage(menuname,pagename){    
        if(pagename === currentPage){
            return
        }
        window.doWebLog("change page to " + pagename)
        window.doWebLog("change menu to " + menuname)
        MYDIALOG.CloseDiv("MyDiv","fade")
        var menu = document.querySelector('#toolMenu')
        if (menu != null) {
            menu.style.height=0;
        }
        

        try{
            if (currentPage != ""  && currentPage != null && currentPage != "invokecontract" && pagename != "querytx"){
            document.getElementById("page_" + currentPage).remove()
            }
        } catch (e) {
            MYDIALOG.ShowDiv("删除页面失败："+e.message);
        }

        currentMenu = menuname
        currentPage = pagename

        var li = document.getElementsByClassName("active")
        for (var i=0; i<li.length;i++){
            li[i].setAttribute("class","hover")
        }
        document.getElementById(menuname).setAttribute("class","active")       

        var result = await window.doGetComponent(pagename)
        window.doWebLog("change page to :"+ pagename)
        var obj
        try{
                obj = JSON.parse(result)
                document.getElementById('pageStyle').remove() 
                //document.getElementById('pageContent').innerHTML = ""
                document.getElementById('pageScript').remove()

                var cs = document.createElement("style")
                cs.setAttribute("id","pageStyle")
                cs.innerHTML = obj.css
                document.head.appendChild(cs)

                var js = document.createElement("script")
                js.setAttribute("id","pageScript")
                js.innerHTML = obj.js
                document.head.appendChild(js)
                //document.getElementById('pageScript').innerHTML = obj.js   

                var content = document.getElementById('pageContent')
                var hasHistory = false
                var i = 0
                for(i = 0;i<content.children.length;i++){
                    window.doWebLog("get a none div node:"+content.childNodes[i].id)                      
                    if (content.children[i].id === "page_" + pagename){
                        //content.childNodes[i].style.width = "100%"
                        window.doWebLog("make show")
                        content.children[i].style.height = "100%"
                        content.children[i].style.display = "block"
                        hasHistory = true
                    } else {
                        //content.childNodes[i].style.width = "0px"
                        window.doWebLog("make hide")
                        content.children[i].style.display = "none"
                        content.childNodes[i].style.height = "0px"
                    }
                }

                if (hasHistory === false){
                    var page = document.createElement("div")
                    page.setAttribute("id","page_" + pagename)  
                    page.setAttribute("style","width:100%;height:100%")  
                    page.innerHTML = obj.html
                    content.appendChild(page)
                    initPage() 
                }
                //document.getElementById('pageContent').innerHTML = obj.html                
                //initPage() 
            }
        catch(err){
            window.doWebLog("get page component error:" + err.message)
            MYDIALOG.ShowDiv("获取页面失败");
        }        
    }

    function showResult(resutl) {
        var objJson = JSON.parse(resutl)
        MYDIALOG.ShowDiv(objJson.Msg)
    }

    function getCurrentAccount(){
        return  document.getElementById("add").value
    }
</script>
</head>

<body style="background: rgb(230, 230, 230);"></body>
    <div id = "menudiv" style="z-index: 100;;display: flex;background-color: #333;position: fixed;top: 0%;left: 0%;width: 100%;">
        <div style="margin-right: auto;">
            <ul>
                <li><a id="qianbao" class="active" onclick="changePage('qianbao','qianbao')">钱包</a></li>                    
                <li><a id="contractasset" onclick="changePage('contractasset','contractasset')">合约资产</a></li>
                <li><a id="transfer" onclick="changePage('transfer','transfer')">转账</a></li>
                <!--li><a id="tools" onclick="changePage('tools','tools')">工具</a></li-->
                <li><a id="tools" onmouseover="onToolsMenu()">工具</a></li>
                <!--li><a id="system" onclick="changePage('system','system')">系统</a></li-->
                <li><a id="system" onmouseover="onSystemMenu()">系统</a></li>
            </ul>   
        </div>  
        <div style="display: flex;align-items: center;">
            <select id="add" name="add" onchange="accountChange()" style="font-size: 14px;height: 25px;width: 300px;border-radius: 0px;"></select>
        </div>      
    </div>   
    <div style="width: 100%;top: 60px;position: absolute;display: flex;flex-direction: column;text-align: center;"> 
        <div style="margin: 0 auto;text-align: center;">
            <div id="pageContent" style="margin: 0 auto;text-align: center;"></div>   
        </div>        
    </div>
    <div id = 'rightmenudiv' style="margin: 0 auto;text-align: center;"> </div>      
</body>
