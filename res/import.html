<!DOCTYPE html>
<html>
<head> 
<meta charset="utf-8"> 
<title>数字货币钱包</title> 
<style>
    table, th, td {
      frame: void;
    }
    tr {
        height:50px;
    }
    input {
        font-size: 14px;
        height:25px;
    }
    .button1 {
        background-color: #656865d8; /* Green */
        border: none;
        color: white;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        -webkit-transition-duration: 0.4s; /* Safari */
        transition-duration: 0.4s;
        width: 200px;
    }
    .button1:hover {
        box-shadow: 0 12px 16px 0 rgba(0,0,0,0.24),0 17px 50px 0 rgba(0,0,0,0.19);
    }

    </style>
    <style id="stylemenu"></style>
    <style id="stylerightmenu"></style>
    <script id="menuscript"></script>
    <script>
        window.onload=function() {             
            window.doGetComponent("menu").then( (result) => {
                var obj = JSON.parse(result)
                document.getElementById('stylemenu').innerHTML = obj.css                   
                document.getElementById('menudiv').innerHTML = obj.html
                document.getElementById("system").setAttribute("class","active")
            }
            )  

            window.doGetComponent("rightmenu").then( (result) => {
                    var obj = JSON.parse(result)
                    document.getElementById('stylerightmenu').innerHTML = obj.css   
                    document.getElementById('rightmenudiv').innerHTML = obj.html
                    document.getElementById('menuscript').innerHTML = obj.js            
                }
            )  
        }


        function importAct() {
            window.doWebLog("进入函数importAct")
            var pa = document.getElementById("pass").value
            window.doWebLog("密码：")
            window.doWebLog(pa)
            var repa = document.getElementById("repass").value
            window.doWebLog("重输密码：")
            window.doWebLog(repa)
            if (pa != repa){
                window.doWebLog("dont match")
                return
            }
            var name = document.getElementById("name").value
            var kk = document.getElementById("kk").value
            window.doImportAccount(pa,name,kk)
        }


    </script>
</head> 
<body>
    <div style="width: 98%;height: 98%;background: rgb(251, 251, 251);position: absolute;"> 
        <div id="menudiv"  style="display: flex;"></div>

        <div style="margin: 0 auto;background-color: aquamarine;text-align: center;">
            <div style="margin: 0 auto;background-color: rgb(236, 255, 127);text-align: center;">
                <table id="table1" style="margin: 0 auto;font-size: 16px;text-align: center;">
                    <tr>
                        <td>私钥:</td>
                        <td><input type="text" id="kk" name="kk" ></td>
                    </tr> 
                    <tr>
                        <td>账户别名:</td>
                        <td><input type="text" id="name" name="name" ></td>
                    </tr> 
                    <tr>
                        <td>输入密码:</td>
                        <td><input type="password" id="pass" name="pass" ></td>
                    </tr> 
                    <tr>
                        <td>重输密码:</td>
                        <td><input type="password" id="repass" name="repass"></td>
                    </tr> 
                </table>
            </div>

            <div style="margin: 0 auto;background-color: rgb(236, 255, 127);text-align: center;">
                <button class="button1" onclick="importAct()">导入账户</button>
            </div>
        </div>
        <div id = 'rightmenudiv'> </div>  
    </div>
</body>
</html>
