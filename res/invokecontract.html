<div >
    <div class="cdiv">
        <table id="contractTable" class="contractTable">        
            <tr >
                <td id="invokecontract_contractaddress" class="firstTd">合约地址:</td>
                <td><input type="text" id="caddress" ></td>
            </tr> 
            <tr>
                <td id="invokecontract_contractabi" class="firstTd">合约ABI:</td>
                <!--td><input type="text" id="filePath" style="width:300px;font-size: 14px;height:25px;" ></td-->
                <td>
                    <select id="abiFile" name="abiFile" class="invokeSelect" onchange="changeAbi()" ></select>
                    <button id="invokecontract_load" class="button1" onclick="loadABI()" style="width: 100px;">加载</button>
                </td>
            </tr> 
            <tr>
                <td id="invokecontract_function" class="firstTd">合约函数:</td>
                <td >
                    <select id="contractFunc" name="contractFunc" onchange="changeFunc()" class="invokeSelect" ></select>
                    <button id="invokecontract_invoke" name="btInvoke" type="button" class="button1" onclick="invoke()" style="width: 100px;">调用</button>
                </td>        
            </tr> 
        </table>
    </div>
    <div id="assDiv" style="visibility:hidden;height: 0px;" class="cdiv">
        <table id="assTable" class="contractTable"> 
            <tr>
                <td id="invokecontract_fee" class="firstTd">预估费用:</td>
                <td >
                    <input type="text" id="invokecontract_input_fee"  style="width: 190px;" ></input>
                    <button id="invokecontract_estimate" type="button" class="button1" onclick="invokecontract_fun_estimate()" style="width: 100px;">预估</button>
                </td>  
            </tr> 
            <tr>
                <td id="invokecontract_acc" class="firstTd">账户密码:</td>
                <td><input type="password" id="invokecontract_ass" ></td>
            </tr> 
        </table>
    </div>
    
    <div class="cdiv">
        <table id="paramterTable" class="invokeTable">
            <tr class="trth"><th colspan="3" id="invokecontract_inputparameter">输入参数</th></tr>
            <tr class="trth">
                <th style="width:100px;" id="invokecontract_parameter">参数</th>
                <th style="width:300px;" id="invokecontract_inputvalue">值</th>
                <th style="width:50px;" id="invokecontract_inputtype" >类型</th>
            </tr>
        </table>
    </div>

    <div class="cdiv" id="outTableDiv" style="visibility:hidden">
        <table id="outTable"  class="invokeTable">
            <tr class="trth"><th colspan="3" id="invokecontract_return" >返回结果</th></tr>
            <tr class="trth">
                <th style="width:100px;" id="invokecontract_returnname" >返回值</th>
                <th style="width:300px;" id="invokecontract_returnvalue">值</th>
                <th style="width:50px;" id="invokecontract_returntype">类型</th>
            </tr>
        </table>
    </div>
</div>
