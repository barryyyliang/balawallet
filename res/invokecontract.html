<div >
    <div class="cdiv">
        <table id="contractTable" class="contractTable">        
            <tr >
                <td>合约地址:</td>
                <td><input type="text" id="caddress" ></td>
            </tr> 
            <tr>
                <td>合约ABI:</td>
                <!--td><input type="text" id="filePath" style="width:300px;font-size: 14px;height:25px;" ></td-->
                <td>
                    <select id="abiFile" name="abiFile" class="invokeSelect" ></select>
                    <button class="button1" onclick="loadABI()" style="width: 100px;">加载</button>
                </td>
            </tr> 
            <tr>
                <td >合约函数:</td>
                <td >
                    <select id="contractFunc" name="contractFunc" onchange="changeFunc()" class="invokeSelect" ></select>
                    <button id="btInvoke" name="btInvoke" type="button" class="button1" onclick="invoke()" style="width: 100px;">调用</button>
                </td>        
            </tr> 
        </table>
    </div>
    <div id="assDiv" style="visibility:hidden;height: 0px;" class="cdiv">
        <table id="assTable" class="contractTable">        
            <tr>
                <td>账户密码:</td>
                <td><input type="password" id="ass" ></td>
            </tr> 
        </table>
    </div>
    
    <div class="cdiv">
        <table id="paramterTable" class="invokeTable">
            <tr class="trth"><th colspan="3">输入参数</th></tr>
            <tr class="trth">
                <th style="width:50px;">参数</th>
                <th style="width:300px;">值</th>
                <th style="width:50px;">类型</th>
            </tr>
        </table>
    </div>

    <div class="cdiv" id="outTableDiv" style="visibility:hidden">
        <table id="outTable"  class="invokeTable">
            <tr class="trth"><th colspan="3">返回结果</th></tr>
            <tr class="trth">
                <th style="width:50px;">返回值</th>
                <th style="width:300px;">值</th>
                <th style="width:50px;">类型</th>
            </tr>
        </table>
    </div>
</div>
