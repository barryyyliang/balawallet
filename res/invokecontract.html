
    <table id="contractTable" style="margin: 0 auto;font-size: 16px;text-align: center;height: 100px;">        
        <tr>
            <td>合约地址:</td>
            <td><input type="text" id="caddress"  style="width:300px;font-size: 14px;height:25px;" ></td>
        </tr> 
        <tr>
            <td>合约ABI:</td>
            <td><input type="text" id="filePath" style="width:300px;font-size: 14px;height:25px;" ></td>
        </tr> 
    </table>
    <div style="margin: 0 auto;background-color: text-align: center;">
        <button class="button1" onclick="loadABI()">加载</button>
    </div>
    <table id="functionTable" style="margin: 0 auto;font-size: 16px;text-align: center;height: 30px;">
        
        <tr>
            <td style="padding:15px;" >调用方法</td>
            <td style="padding:15px;">
                <select id="contractFunc" name="contractFunc" onchange="changeFunc()" style="font-size: 14px;height: 25px;width: 200px;border-radius: 0px;"></select>
            </td>
            <td><input type="text" id="functype" style="width:100px;font-size: 14px;height:25px;" readonly="readonly" ></td>           
        </tr> 
    </table>
    <table id="paramterTable" style="margin: 0 auto;font-size: 16px;text-align: center;border: 1px solid black;">
        <tr>
            <th style="background-color:green;width:50px;">参数</th>
            <th style="background-color:green;width:300px;">值</th>
            <th style="background-color:green;width:50px;">类型</th>
        </tr>
    </table>
    <div style="margin: 0 auto;background-color: text-align: center;">
        <button id="btInvoke" name="btInvoke" type="button" class="button1" onclick="invoke()">调用</button>
    </div>
    <table id="outTable" style="margin: 0 auto;font-size: 16px;text-align: center;border: 1px solid black;">
        <tr>
            <th style="background-color:green;width:50px;">返回值</th>
            <th style="background-color:green;width:300px;">值</th>
            <th style="background-color:green;width:50px;">类型</th>
        </tr>
    </table>
