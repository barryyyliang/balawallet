
    <table id="contractTable">        
        <tr >
            <td>合约地址:</td>
            <td><input type="text" id="caddress" ></td>
        </tr> 
        <tr>
            <td>合约ABI:</td>
            <!--td><input type="text" id="filePath" style="width:300px;font-size: 14px;height:25px;" ></td-->
            <td><select id="abiFile" name="abiFile" style="width: 300px"></select></td>
        </tr> 
    </table>
    <div >
        <button class="button1" onclick="loadABI()">加载</button>
    </div>
    <table id="functionTable">  
        <tr>
            <td >合约函数:</td>
            <td >
                <select id="contractFunc" name="contractFunc" onchange="changeFunc()" style="width: 300px;"></select>
            </td>        
        </tr> 
    </table>
    <table id="paramterTable" class="table1">
        <tr class="trth">
            <th style="width:50px;">参数</th>
            <th style="width:300px;">值</th>
            <th style="width:50px;">类型</th>
        </tr>
    </table>
    <table id="assTable" style="visibility:hidden">        
        <tr>
            <td>账户密码:</td>
            <td><input type="password" id="ass" ></td>
        </tr> 
    </table>
    <div >
        <button id="btInvoke" name="btInvoke" type="button" class="button1" onclick="invoke()">调用</button>
    </div>
    <table id="outTable" class="table1" style="visibility:hidden">
        <tr class="trth">
            <th style="width:50px;">返回值</th>
            <th style="width:300px;">值</th>
            <th style="width:50px;">类型</th>
        </tr>
    </table>
