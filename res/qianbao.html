<!DOCTYPE html>
<html>
<head> 
<meta charset="utf-8"> 
<title>数字货币钱包</title> 
<style>

    /*主菜单*/
    table, th, td {
      frame: void;
    }
    ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #333;
    }

    li {
        float: left;
    }

    li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
    }

    li a:hover {
        background-color: #111;
    } 
    li a.active {
        background-color: rgb(100, 145, 100);
    }
    /*主菜单 end*/

    /*弹出菜单*/
    .black_overlay{
        display: none;
        position: absolute;
        top: 0%;
        left: 0%;
        width: 100%;
        height: 100%;
        background-color: black;
        z-index:1001;
        -moz-opacity: 0.8;
        opacity:.80;
        filter: alpha(opacity=80);
    }
    .white_content {
        display: none;
        position: absolute;
        top: 10%;
        left: 10%;
        width: 80%;
        height: 80%;
        border: 5px solid rgb(200, 60, 30);
        background-color: white;
        z-index:1002;
        overflow: auto;
    }
    .white_content_small {
        display: none;
        position: absolute;
        top: 20%;
        left: 30%;
        width:40%;
        height: 50%;
        border: 5px solid rgb(200, 60, 30);
        background-color: white;
        z-index:1002;
        overflow: auto;
    }

    #menu{
    width: 0; /*设置为0 隐藏自定义菜单*/
    height: 125px;
    overflow: hidden; /*隐藏溢出的元素*/
    box-shadow: 0 1px 1px #888,1px 0 1px #ccc;
    position: absolute; /*自定义菜单相对与body元素进行定位*/
    }
    .menu{
        width: 130px;
        height: 25px;
        line-height: 25px;
        padding: 0 10px;
        background: rgb(126, 126, 121);
    }
    .menu:hover {
        background-color: rgb(245, 245, 245);
    }


    .button1 {
        background-color: #656865d8; /* Green */
        border: none;
        color: white;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        -webkit-transition-duration: 0.4s; /* Safari */
        transition-duration: 0.4s;
        width: 100px;
        height: 30px;
    }
    .button1:hover {
        box-shadow: 0 12px 16px 0 rgba(0,0,0,0.24),0 17px 50px 0 rgba(0,0,0,0.19);
    }
</style>
<style id="stylerightmenu"></style>
<script id="menuscript"></script>
<script>
    function changeName(address,name){
        window.doWebLog("enter changeName")
        window.doWebLog(address)
        var addressvalue = document.getElementById(address).value
        var namevalue = document.getElementById(name).value
        window.doChangeAccountName(addressvalue,namevalue)
    }
    function management(address,name){
        window.doWebLog("enter management")

    }
    function addAccountElement(acc,table){
        window.doWebLog("enter addelement")
        for (i=0; i<acc.length; i++){
            var par = acc[i].split('-')

            var tr = document.createElement("tr")
            tr.setAttribute("style","height:50px;")
            var td1 = document.createElement("td")
            td1.append("Eth: ")
            tr.append(td1)

            var ipt = document.createElement("input")
            ipt.setAttribute("id","address"+i)
            ipt.setAttribute("style","font-size: 14px;height:25px;")
            ipt.setAttribute("type","text")
            ipt.setAttribute("value",par[0])
            ipt.setAttribute("size","45")   
            ipt.setAttribute("disabled","")         
            var td2 = document.createElement("td")
            td2.append(ipt)
            tr.append(td2)


            var td3 = document.createElement("td")
            var ipt2 = document.createElement("input")
            ipt2.setAttribute("id","name"+i)
            ipt2.setAttribute("style","font-size: 14px;height:25px;")
            ipt2.setAttribute("type","text")
            ipt2.setAttribute("value",par[1])
            ipt2.setAttribute("size","20")  
            td3.append(ipt2)
            tr.append(td3)

            var td4 = document.createElement("td")               
            var bt = document.createElement("input")
            bt.setAttribute("class","button1")
            bt.setAttribute("type","button")
            bt.setAttribute("value","修改别名")
            bt.setAttribute("onclick","changeName("+"'address"+i +"'" +",'name"+i+"')")
            td4.append(bt) 
            tr.append(td4)

            var td5 = document.createElement("td") 
            var bt2 = document.createElement("input")
            bt2.setAttribute("class","button1")
            bt2.setAttribute("type","button")
            bt2.setAttribute("value","管理")
            bt2.setAttribute("onclick","management("+"'address"+i +"'" +",'name"+i+"')")
            td5.append(bt2)          
            tr.append(td5)

            table.append(tr)
        }
        //ShowDiv("MyDiv","fade")

    }


    window.onload=function() {
        window.doWebLog("qianbao page")
        window.doGetAccounts().then( (result) => {
            window.doWebLog("get result" + result)
            var arr = result.split(',')
            window.doWebLog("go to addelement")
            addAccountElement(arr,document.getElementById("table1"))
        }
        )

        window.doGetComponent("rightmenu").then( (result) => {
                var obj = JSON.parse(result)
                document.getElementById('stylerightmenu').innerHTML = obj.css   
                document.getElementById('rightmenudiv').innerHTML = obj.html
                document.getElementById('menuscript').innerHTML = obj.js            
            }
        )  
    }
</script>
</head> 
<body oncontextmenu="return false" onselectstart="return false">
    <div style="width: 98%;height: 98%;background: rgb(251, 251, 251);position: absolute;"> 
        <div id = "menudiv">
            <ul>
                <li><a class="active" onclick="window.doChangePage('qianbao.html','')">钱包</a></li>
                <li><a onclick="window.doChangePage('transfer.html','')">转账</a></li>
                <li><a onclick="window.doChangePage('contractasset.html','')">合约资产</a></li>
                <li><a onclick="window.doChangePage('tools.html','')">工具</a></li>
                <li><a onclick="window.doChangePage('system.html','')">系统</a></li>
            </ul>
        </div>    

        <div style="margin: 0 auto;background-color: aquamarine;text-align: center;">
            <div style="margin: 0 auto;background-color: rgb(236, 255, 127);text-align: center;">
                <table id="table1" style="margin: 0 auto;font-size: 16px;text-align: center;">
                    <tr>
                        <th>类型</th>
                        <th>地址</th>
                        <th>别名</th>
                    </tr> 
                </table>
            </div>
        </div>   
        <div id = 'rightmenudiv'> </div>  
    </div>    
</body>
</html>
