<!DOCTYPE html>
<html>
<head> 
<meta charset="utf-8"> 
<title>数字货币钱包</title> 
<style>
    table, th, td {
      frame: void;
    }
    tr {
        height:50px;
    }
    input {
        font-size: 14px;
        height: 25px;
        width: 200px;
    }
    ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #333;
    }

    li {
        float: left;
    }

    li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 16px;
    }

    li a:hover {
        background-color: #111;
    } 
    li a:active {
        background-color: #111;
    }


    .button1 {
        background-color: #656865d8; /* Green */
        border: none;
        color: white;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        -webkit-transition-duration: 0.4s; /* Safari */
        transition-duration: 0.4s;
        width: 200px;
    }
    .button1:hover {
        box-shadow: 0 12px 16px 0 rgba(0,0,0,0.24),0 17px 50px 0 rgba(0,0,0,0.19);
    }

    </style>
    <style id="stylerightmenu"></style>
    <script id="menuscript"></script>
    <script>

        function ontransfer() {
            window.doWebLog("enter transfer")
            var pa = document.getElementById("pass").value
            window.doWebLog("pa value:"+pa)
            var add = document.getElementById("add").value
            window.doWebLog("add value:" + add) 
            var toAddress = document.getElementById("toAddress").value
            window.doWebLog("toAddress value:" + toAddress)  
            var amount = document.getElementById("amount").value
            window.doWebLog("amount value:" + amount) 
            window.doTransfer(add, toAddress,amount,pa)
        }

        function change(){
            window.doWebLog("value changed")
            var address = document.getElementById("add").value            
            window.doGetAccountName(address).then ( (result) => {
                window.doWebLog(result)
                document.getElementById("name").value = result
            }
            )
            window.doGetBalance(address).then ( (result) => {
                document.getElementById("balance").value = result
            }
            )
        }

         window.onload=function() {
            window.doGetComponent("rightmenu").then( (result) => {
                var obj = JSON.parse(result)
                document.getElementById('stylerightmenu').innerHTML = obj.css   
                document.getElementById('rightmenudiv').innerHTML = obj.html
                document.getElementById('menuscript').innerHTML = obj.js            
            }
            ) 
            window.doGetAccounts().then( (result) => {
                window.doWebLog("get result" + result)
                var acc = result.split(',')
                var se = document.getElementById("add")
                var option = document.createElement("option")
                option.text = ""
                option.value = ""
                se.add(option)
                for (i=0; i<acc.length; i++){
                    window.doWebLog(acc[i])
                    var par = acc[i].split('-')
                    var option = document.createElement("option")
                    option.text = par[0]
                    option.value = par[0]
                    se.add(option)
                }
                se.value = ""            
            }
            )

            window.doGetFee().then ( (result) => {
                window.doWebLog("get fee:" + result)
                if (result.length == 0 ) {
                    window.doWebLog("cannot get fee")
                    MYDIALOG.ShowDiv("MyDiv","fade", "无法获得预估转账费用");
                    return;
                }
                var se = document.getElementById("fee");
                se.value = result;
            }
            )            
        } 
    </script>
</head> 
<body>
    <div style="width: 98%;height: 98%;background: rgb(251, 251, 251);position: absolute;"> 
        <ul>
            <li><a class="active" onclick="window.doChangePage('qianbao.html','')">钱包</a></li>
            <li><a onclick="window.doChangePage('transfer.html','')">转账</a></li>
            <li><a onclick="window.doChangePage('contractasset.html','')">合约资产</a></li>
            <li><a onclick="window.doChangePage('market.html','')">市场</a></li>
            <li><a onclick="window.doChangePage('system.html','')">系统</a></li>
        </ul>

        <div style="margin: 0 auto;background-color: aquamarine;text-align: center;">

            <div style="margin: 0 auto;background-color: rgb(236, 255, 127);text-align: center;">
                <table id="table1" style="margin: 0 auto;font-size: 16px;text-align: center;">
                    <tr>
                        <td>转出账户:</td>
                        <td>
                            <select id="add" name="add" onchange="change()" style="font-size: 14px;height: 25px;width: 300px;border-radius: 0px;">

                            </select>
                        </td>
                    </tr> 
                    <tr>
                        <td>别名:</td>
                        <td><input type="text" id="name" name="name" style="width:300px" disabled></td>
                    </tr> 
                    <tr>
                        <td>余额:</td>
                        <td><input type="text" id="balance" name="balance" style="width:300px" disabled></td>
                    </tr> 
                </table>
            </div>
            <div style="margin: 0 auto;background-color: rgb(40, 190, 170);text-align: center;">
                <table id="table2" style="margin: 0 auto;font-size: 16px;text-align: center;"> 
                    <tr>
                        <td>接收地址:</td>
                        <td><input type="text" id="toAddress" name="toAddress" style="width:300px"></td>
                    </tr> 
                    <tr>
                        <td>金额:</td>
                        <td><input type="text" id="amount" name="amount" style="width:300px"></td>
                    </tr> 
                    <tr>
                        <td>预估费用:</td>
                        <td><input type="text" id="fee" name="fee" style="width:300px" disabled></td>
                    </tr> 
                    <tr>
                        <td>密码:</td>
                        <td><input type="password" id="pass" name="pass" style="width:300px"></td>
                    </tr> 
                </table>
            </div>

            <div style="margin: 0 auto;background-color: rgb(40, 190, 170);text-align: center;">
                <button class="button1" onclick="ontransfer()">转账</button>
            </div>
        </div> 
        <div id = 'rightmenudiv'> </div>  
    </div>
</body>
</html>
