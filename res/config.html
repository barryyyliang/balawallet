<!DOCTYPE html>
<html>
<head> 
<meta charset="utf-8"> 
<title>数字货币钱包</title> 
<style>
    table, th, td {
      frame: void;
    }
    tr {
        height:50px;
    }
    input {
        font-size: 14px;
        height: 25px;
        width: 200px;
    }
    ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #333;
    }

    li {
        float: left;
    }

    li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 16px;
    }

    li a:hover {
        background-color: #111;
    } 
    li a:active {
        background-color: #111;
    }


    .button1 {
        background-color: #656865d8; /* Green */
        border: none;
        color: white;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        -webkit-transition-duration: 0.4s; /* Safari */
        transition-duration: 0.4s;
        width: 200px;
    }
    .button1:hover {
        box-shadow: 0 12px 16px 0 rgba(0,0,0,0.24),0 17px 50px 0 rgba(0,0,0,0.19);
    }

    </style>
    <style id="stylerightmenu"></style>
    <script id="menuscript"></script>
    <script>
        function onSaveConfig() {
            var address = document.getElementById("nodeAddress").value

            var json = JSON.stringify({'nodeAddress':address})
            window.doWebLog(json)

            window.doConfig(json)
        }

        window.onload=function() {
            window.doGetComponent("rightmenu").then( (result) => {
                var obj = JSON.parse(result)
                document.getElementById('stylerightmenu').innerHTML = obj.css   
                document.getElementById('rightmenudiv').innerHTML = obj.html
                document.getElementById('menuscript').innerHTML = obj.js            
            }
            ) 
            var jsonconfig = JSON.stringify(["nodeAddress","usernames"])
            window.doWebLog(jsonconfig)
            
            window.doGetConfig(jsonconfig).then( (result) => {
                window.doWebLog("get result" + result)
                var acc = JSON.parse(result)
                for (var val in acc){
                    document.getElementById(val).value = acc[val] 
                }      
            }
            )
        } 
    </script>
</head> 
<body>
    <div style="width: 98%;height: 98%;background: rgb(251, 251, 251);position: absolute;"> 
        <ul>
            <li><a class="active" onclick="window.doChangePage('qianbao.html','')">钱包</a></li>
            <li><a onclick="window.doChangePage('transfer.html','')">转账</a></li>
            <li><a onclick="window.doChangePage('contractasset.html','')">合约资产</a></li>
            <li><a onclick="window.doChangePage('market.html','')">市场</a></li>
            <li><a onclick="window.doChangePage('system.html','')">系统</a></li>
        </ul>

        <div style="margin: 0 auto;background-color: rgb(236, 255, 127);text-align: center;">
            <div style="margin: 0 auto;background-color: rgb(236, 255, 127);text-align: center;">
                <table id="table1" style="margin: 0 auto;font-size: 16px;text-align: center;">
                    <tr>
                        <td>节点地址:</td>
                        <td><input type="text" id="nodeAddress" name="nodeAddress" style="width:300px"></td>
                    </tr> 
                    <tr>
                        <td>****:</td>
                        <td><input type="text" id="amount" name="amount" style="width:300px"></td>
                    </tr> 

                </table>
            </div>

            <div style="margin: 0 auto;background-color: rgb(236, 255, 127);text-align: center;">
                <button class="button1" onclick="onSaveConfig()">保存</button>
            </div>
        </div> 
        <div id = 'rightmenudiv'> </div>  
    </div>
</body>
</html>
