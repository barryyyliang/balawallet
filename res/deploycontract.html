<div class="cdiv">
    <table class="contractTable">
        <tr>
            <td id="deploycontract_file">合约文件(bin):</td>
            <td><select id="binFile" name="binFile" style="font-size: 14px;height: 30px;width: 300px;border-radius: 0px;"></select></td>
            <!--td><button class="button1" onclick="selectfile()">选择</button></td--></td>
        </tr> 
        <tr>
            <td id="deploycontractabi_file">ABI文件(abi):</td>
            <td><select id="deploycontractabiFile" style="font-size: 14px;height: 30px;width: 300px;border-radius: 0px;" onchange="deploycontract_func_abichange()"></select></td>
            <!--td><button class="button1" onclick="selectfile()">选择</button></td--></td>
        </tr> 
        <tr>
            <td id="deploycontract_acc">账户密码:</td>
            <td><input type="password" id="deploycontract_ass"  style="font-size: 14px;height: 25px;width: 300px;"></td>        
        </tr> 
        <tr>
            <td id="deploycontract_fee" class="firstTd">预估费用:</td>
            <td >
                <input type="text" id="deploycontract_input_fee"  style="width: 190px;" ></input>
                <button id="deploycontract_estimate" type="button" class="button1" onclick="deploycontract_fun_estimate()" style="width: 100px;">预估</button>
            </td>  
        </tr> 
    </table>
</div>

<div id="deploycontract_parameter_div" class="cdiv">
    <table id="deploycontract_paramterTable" class="invokeTable">
        <tr class="trth"><th colspan="3" id="deploycontract_inputparameter">构造参数</th></tr>
        <tr class="trth">
            <th style="width:100px;" id="deploycontract_parameter">参数</th>
            <th style="width:300px;" id="deploycontract_inputvalue">值</th>
            <th style="width:50px;" id="deploycontract_inputtype" >类型</th>
        </tr>
    </table>
</div>
<div style="margin: 0 auto;text-align: center;"></div>
    <td><button id="deploycontract_deploy" class="button1" onclick="deploy()">部署</button></td>
</div>
<input type="file" id="contractFile" style="display: none;" onchange="changedfile()">
