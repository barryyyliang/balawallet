<!DOCTYPE html>
<html>
<head> 
<meta charset="utf-8"> 
<title>数字货币钱包</title> 
<style>
    table, th, td {
      frame: void;
    }
    tr {
        height:50px;
    }
    input {
        font-size: 14px;
        height: 25px;
        width: 200px;
    }
    ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #333;
    }

    li {
        float: left;
    }

    li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 16px;
    }

    li a:hover {
        background-color: #111;
    } 
    li a:active {
        background-color: #111;
    }


    .button1 {
        background-color: #656865d8; /* Green */
        border: none;
        color: white;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        -webkit-transition-duration: 0.4s; /* Safari */
        transition-duration: 0.4s;
        width: 200px;
    }
    .button1:hover {
        box-shadow: 0 12px 16px 0 rgba(0,0,0,0.24),0 17px 50px 0 rgba(0,0,0,0.19);
    }

    </style>
    <script>
        function exportAct() {
            window.weblog("enter exportAct")
            var pa = document.getElementById("pass").value
            window.weblog("pa value:"+pa)
            var va = document.getElementById("add").value
            window.weblog("add value:" + va)  
            window.exportAccount(va, pa)
        }

         window.onload=function() {
            window.weblog("export page")
            window.getAccounts().then( (result) => {
                window.weblog("get result" + result)
                var acc = result.split(',')
                window.weblog("go to addelement")
                var se = document.getElementById("add")
                window.weblog("get select addelement")
                for (i=0; i<acc.length; i++){
                    window.weblog(acc[i])
                    var par = acc[i].split('-')
                    var option = document.createElement("option")
                    option.text = par[0]
                    option.value = par[0]
                    window.weblog("add:" + par[0])
                    se.add(option)
                }            
            }
            )
        } 
    </script>
</head> 
<body>
    <ul>
        <li><a class="active" onclick="window.changePage('qianbao.html','')">钱包</a></li>
        <li><a onclick="window.changePage('transfer.html','')">转账</a></li>
        <li><a onclick="window.changePage('contractasset.html','')">合约资产</a></li>
        <li><a onclick="window.changePage('market.html','')">市场</a></li>
        <li><a onclick="window.changePage('system.html','')">系统</a></li>
    </ul>

    <div style="margin: 0 auto;background-color: aquamarine;text-align: center;">

        <div style="margin: 0 auto;background-color: rgb(236, 255, 127);text-align: center;">
            <table id="table1" style="margin: 0 auto;font-size: 16px;text-align: center;">
                 <tr>
                    <td>账户</td>
                    <td>
                        <select id="add" name="add" style="font-size: 14px;height: 25px;width: 200px;border-radius: 0px;">

                        </select>
                    </td>
                </tr>  
                <tr>
                    <td>输入密码:</td>
                    <td><input type="password" id="pass" name="pass" ></td>
                </tr> 
            </table>
        </div>

        <div style="margin: 0 auto;background-color: rgb(236, 255, 127);text-align: center;">
            <button class="button1" onclick="exportAct()">导出</button>
        </div>
    </div>
 
</body>
</html>
