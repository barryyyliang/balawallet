
<div>
    <table style="margin: 0 auto;font-size: 16px;text-align: center;">
        <tr>
            <td id="dapp_title" style="font-size: 18px;font-weight: bold;">连接 Dapp</td>
        </tr> 
    </table>
</div>

<!-- 连接输入区域 -->
<div id="dapp_connect_area">
    <div style="margin: 10px 0;text-align: center;">
        <label id="dapp_uri_label" style="font-size: 16px;">WalletConnect URI:</label>
    </div>
    <div>
        <textarea id="dapp_uri_input" rows="4" cols="50" placeholder="wc:..." style="margin: 0 auto;font-size: 14px;font-family: monospace;"></textarea>
    </div>
    <div style="margin: 15px 0;text-align: center;">
        <button id="dapp_connect_btn" class="button1" onclick="dappConnect()">连接</button>
        <button id="dapp_disconnect_btn" class="button1" onclick="dappDisconnect()" style="display:none;background-color:#f44336;">断开连接</button>
    </div>
</div>

<!-- Dapp 图标区域 -->
<div id="dapp_icon_area" style="margin: 10px auto;text-align: center;display:none;">
    <img id="dapp_icon_img" src="" style="width: 64px;height: 64px;border-radius: 12px;border: 1px solid #ddd;" onerror="this.style.display='none'"/>
</div>

<!-- 连接状态区域 -->
<div id="dapp_status_area" style="margin: 20px auto;display:none;">
    <div style="border: 1px solid #ccc;border-radius: 5px;padding: 15px;background: #fafafa;">
        <table style="margin: 0 auto;font-size: 14px;text-align: left;">
            <tr>
                <td id="dapp_status_label" style="width: 120px;font-weight: bold;">连接状态:</td>
                <td><span id="dapp_status_value" style="color: green;">--</span></td>
            </tr>
            <tr>
                <td id="dapp_name_label" style="font-weight: bold;">Dapp 名称:</td>
                <td><span id="dapp_name_value">--</span></td>
            </tr>
            <tr>
                <td id="dapp_url_label" style="font-weight: bold;">Dapp URL:</td>
                <td><span id="dapp_url_value" style="color: #0066cc;word-break: break-all;">--</span></td>
            </tr>
            <tr id="dapp_desc_row" style="display:none;">
                <td style="font-weight: bold;">描述:</td>
                <td><span id="dapp_desc_value" style="color: #666;">--</span></td>
            </tr>
            <tr>
                <td id="dapp_chain_label" style="font-weight: bold;">Chain ID:</td>
                <td><span id="dapp_chain_value">--</span></td>
            </tr>
            <tr>
                <td id="dapp_account_label" style="font-weight: bold;">已授权账户:</td>
                <td><span id="dapp_account_value" style="font-family: monospace;word-break: break-all;">--</span></td>
            </tr>
        </table>
    </div>
</div>

<!-- 签名请求区域 -->
<div id="dapp_request_area" style="margin: 20px auto;display:none;">
    <div style="border: 2px solid #e8a838;border-radius: 5px;padding: 15px;background: #fff8e8;">
        <div style="font-size: 16px;font-weight: bold;color: #e8a838;margin-bottom: 10px;">
            <span id="dapp_request_title">⚠️ 签名请求</span>
        </div>
        <input type="hidden" id="dapp_request_id" value="0" />
        <div style="margin: 10px 0;">
            <label id="dapp_request_method_label" style="font-weight: bold;">请求方法:</label>
            <span id="dapp_request_method" style="font-family: monospace;color: #333;">--</span>
        </div>
        <div style="margin: 10px 0;">
            <label id="dapp_request_data_label" style="font-weight: bold;">请求数据:</label>
            <div>
                <textarea id="dapp_request_data" rows="6" cols="50" readonly style="margin: 0 auto;font-size: 13px;font-family: monospace;background: #f5f5f5;"></textarea>
            </div>
        </div>
        <div style="margin: 10px 0;">
            <label id="dapp_request_pass_label" style="font-weight: bold;">账户密码:</label>
            <input type="password" id="dapp_request_pass" style="width: 300px;">
        </div>
        <div style="margin: 15px 0;text-align: center;">
            <button id="dapp_approve_btn" class="button1" onclick="dappApprove()" style="background-color: #4CAF50;color:white;">批准</button>
            <button id="dapp_reject_btn" class="button1" onclick="dappReject()" style="background-color: #f44336;color:white;">拒绝</button>
        </div>
    </div>
</div>

<!-- 操作日志区域 -->
<div id="dapp_log_area">
    <div style="margin: 10px 0;text-align: center;">
        <label id="dapp_log_label" style="font-size: 16px;font-weight: bold;">操作日志:</label>
    </div>
    <div>
        <textarea id="dapp_log" rows="10" cols="50" readonly style="margin: 0 auto;font-size: 13px;font-family: monospace;background: #f5f5f5;"></textarea>
    </div>
</div>
