<!DOCTYPE html>
<html>
<head> 
<meta charset="utf-8"> 
<meta http-equiv="X-Frame-Options" content="allow-from https://github.com/">

<title>数字货币钱包</title> 
<style>
    table, th, td {
      frame: void;
    }
    
    .button1 {
        background-color: #656865d8; /* Green */
        border: none;
        color: white;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        -webkit-transition-duration: 0.4s; /* Safari */
        transition-duration: 0.4s;
        width: 100px;
        height: 30px;
    }
    .button1:hover {
        box-shadow: 0 12px 16px 0 rgba(0,0,0,0.24),0 17px 50px 0 rgba(0,0,0,0.19);
    }
    </style>
    <style id="stylemenu"></style>
    <style id="stylerightmenu"></style>
    <script id="menuscript"></script>
    <script>
        window.onload=function() {
            window.doGetComponent("menu").then( (result) => {
                var obj = JSON.parse(result)
                document.getElementById('stylemenu').innerHTML = obj.css                   
                document.getElementById('menudiv').innerHTML = obj.html
                document.getElementById("tools").setAttribute("class","active")
            }
            )  
            window.doGetComponent("rightmenu").then( (result) => {
                var obj = JSON.parse(result)
                document.getElementById('stylerightmenu').innerHTML = obj.css   
                document.getElementById('rightmenudiv').innerHTML = obj.html
                document.getElementById('menuscript').innerHTML = obj.js            
            }
            )         
        } 

        function selectfile(){
            document.getElementById("contractFile").click()
        }

        function changedfile(){
            document.getElementById("filePath").value = document.getElementById("contractFile").value
        }
    </script>
</head> 
<body>
    <div style="width: 98%;height: 98%;background: rgb(251, 251, 251);position: absolute;"> 
        <div id="menudiv" style="display: flex;"></div>
        <div>
            <table style="margin: 0 auto;font-size: 16px;text-align: center;">
                <tr>
                    <td>合约文件:</td>
                    <td><input type="text" id="filePath" style="width:300px;font-size: 14px;height:25px;" ></td>
                    <td><button class="button1" onclick="selectfile()">选择</button></td>
                    <td><button class="button1" onclick="deploy()">部署</button></td>
                </tr> 
            </table>
            <input type="file" style="display: none;" id="contractFile" onchange="changedfile()">
        </div>
        <div id = 'rightmenudiv'> </div>
    </div>
</body>
</html>
